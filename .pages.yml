media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories: [image]

content:
  - name: site
    label: Site Settings
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: brand
        label: Brand
        type: string
      - name: tagline_en
        label: English Tagline
        type: string
      - name: tagline_ko
        label: Korean Tagline
        type: text
      - name: location
        label: Location
        type: string
      - name: email
        label: Email
        type: string
      - name: kakao
        label: Kakao Open Chat URL
        type: string
      - name: instagram
        label: Instagram URL
        type: string
      - name: facebook
        label: Facebook URL
        type: string
      - name: youtube
        label: YouTube URL
        type: string
      - name: music_link
        label: Main Music URL
        type: string

  - name: about
    label: About
    type: file
    path: _data/about.yml
    format: yaml
    fields:
      - name: heading
        label: Main Heading
        type: string
      - name: bio_short
        label: Short Bio
        type: text
      - name: bio_long
        label: Long Bio
        type: text
      - name: statement
        label: Artist Statement
        type: text

  - name: visual_intro
    label: Visual Intro
    type: file
    path: _data/visual.yml
    format: yaml
    fields:
      - name: hero_statement
        label: Main Visual Statement
        type: text
      - name: intro
        label: Short Introduction
        type: text
      - name: practice
        label: Visual Practice
        type: text
      - name: method
        label: Method
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{code} {en} — {ko}"
        fields:
          - name: code
            label: Number
            type: string
          - name: en
            label: English
            type: string
          - name: ko
            label: Korean
            type: string
          - name: description
            label: Description
            type: text
      - name: language_intro
        label: Visual Language Introduction
        type: text
      - name: language
        label: Visual Language Keywords
        type: string
        list: true

  - name: music
    label: Music
    type: collection
    path: _music
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: medium
        label: Medium
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover Image
        type: image
      - name: featured
        label: Featured on Home
        type: boolean
      - name: external_url
        label: External Link
        type: string
      - name: body
        label: Body
        type: rich-text

  - name: visual
    label: Visual
    type: collection
    path: _visual
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: visual_type
        label: Visual Type
        type: string
        description: "Series pages use: series"
      - name: order
        label: Display Order
        type: number
      - name: category
        label: Category
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: medium
        label: Medium
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Uploaded Cover Image
        type: image
      - name: remote_cover
        label: External Cover Image URL
        type: string
        description: "Used for current Google Drive artwork. Uploaded cover takes priority."
      - name: gallery
        label: Artwork Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {group}"
        fields:
          - name: title
            label: Artwork Title
            type: string
          - name: group
            label: Gallery Group
            type: string
          - name: image
            label: Uploaded Image
            type: image
          - name: remote_image
            label: External Image URL
            type: string
          - name: drive_url
            label: Original / External Link
            type: string
          - name: note
            label: Artist Note
            type: text
      - name: featured
        label: Featured on Home
        type: boolean
      - name: external_url
        label: External Link
        type: string
      - name: body
        label: Series Statement / Artist Note
        type: rich-text

  - name: projects
    label: Projects
    type: collection
    path: _projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: medium
        label: Format / Medium
        type: string
      - name: client
        label: Institution / Collaborator
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover Image
        type: image
      - name: featured
        label: Featured on Home
        type: boolean
      - name: external_url
        label: External Link
        type: string
      - name: body
        label: Project Description
        type: rich-text

  - name: writing
    label: Writing
    type: collection
    path: _writing
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: date
        label: Date
        type: date
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover Image
        type: image
      - name: featured
        label: Featured
        type: boolean
      - name: body
        label: Body
        type: rich-text
