media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories: [image]

content:
  - name: site
    label: Site Settings
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: brand
        label: Brand
        type: string
      - name: tagline_en
        label: English Tagline
        type: string
      - name: tagline_ko
        label: Korean Tagline
        type: text
      - name: location
        label: Location
        type: string
      - name: email
        label: Email
        type: string
      - name: kakao
        label: Kakao Open Chat URL
        type: string
      - name: instagram
        label: Instagram URL
        type: string
      - name: facebook
        label: Facebook URL
        type: string
      - name: youtube
        label: YouTube URL
        type: string
      - name: music_link
        label: Main Music URL
        type: string

  - name: about
    label: About
    type: file
    path: _data/about.yml
    format: yaml
    fields:
      - name: heading
        label: Main Heading
        type: string
      - name: bio_short
        label: Short Bio
        type: text
      - name: bio_long
        label: Long Bio
        type: text
      - name: statement
        label: Artist Statement
        type: text
      - name: cv
        label: Selected CV
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year} — {item}"
        fields:
          - name: year
            label: Year
            type: string
          - name: item
            label: Activity / Role
            type: string
      - name: press
        label: Press Archive
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Article / Interview
            type: string
          - name: url
            label: Source URL
            type: string

  - name: visual_intro
    label: Visual Intro
    type: file
    path: _data/visual.yml
    format: yaml
    fields:
      - name: hero_statement
        label: Main Visual Statement
        type: text
      - name: intro
        label: Short Introduction
        type: text
      - name: practice
        label: Visual Practice
        type: text
      - name: method
        label: Method
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{code} {en} — {ko}"
        fields:
          - name: code
            label: Number
            type: string
          - name: en
            label: English
            type: string
          - name: ko
            label: Korean
            type: string
          - name: description
            label: Description
            type: text
      - name: language_intro
        label: Visual Language Introduction
        type: text
      - name: language
        label: Visual Language Keywords
        type: string
        list: true

  - name: music_practice
    label: Music Practice & Philosophy
    type: file
    path: _data/music.yml
    format: yaml
    fields:
      - name: hero_statement
        label: Main Music Statement
        type: text
      - name: intro
        label: Short Introduction
        type: text
      - name: practice
        label: Sound Practice
        type: text
      - name: characteristics
        label: Musical Characteristics
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{code} — {title}"
        fields:
          - name: code
            label: Number
            type: string
          - name: title
            label: Title
            type: string
          - name: en
            label: English Keyword
            type: string
          - name: description
            label: Description
            type: text
      - name: practice_intro
        label: Production Practice
        type: text
      - name: roles
        label: Creative Roles
        type: string
        list: true
      - name: aesthetic
        label: Personal Aesthetic
        type: text
      - name: aesthetic_keywords
        label: Aesthetic Keywords
        type: string
        list: true
      - name: melon_artist_url
        label: Melon Artist URL
        type: string
      - name: discography
        label: Discography
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} {title}"
        fields:
          - name: title
            label: Release Title
            type: string
          - name: type
            label: Release Type
            type: string
          - name: date
            label: Release Date (YYYY.MM.DD)
            type: string
          - name: tracks
            label: Track Count Text
            type: string

  - name: music
    label: Music
    type: collection
    path: _music
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: music_type
        label: Music Entry Type (release)
        type: string
      - name: layout
        label: Detail Layout (music-release)
        type: string
      - name: release_type
        label: Album / Single / EP
        type: string
      - name: date
        label: Sort Date
        type: date
      - name: release_date
        label: Display Release Date
        type: string
      - name: track_count
        label: Track Count
        type: number
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: medium
        label: Medium
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover Image
        type: image
      - name: remote_cover
        label: External Cover Image URL
        type: string
      - name: tracklist
        label: Tracklist
        type: string
        list: true
      - name: listen_links
        label: Listening Links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Platform Name
            type: string
          - name: url
            label: URL
            type: string
      - name: credits
        label: Credits
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{role} — {name}"
        fields:
          - name: role
            label: Role
            type: string
          - name: name
            label: Name
            type: string
      - name: featured
        label: Featured on Home
        type: boolean
      - name: external_url
        label: External Link
        type: string
      - name: body
        label: Body
        type: rich-text

  - name: visual
    label: Visual
    type: collection
    path: _visual
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: visual_type
        label: Visual Type
        type: string
        description: "Series pages use: series"
      - name: order
        label: Display Order
        type: number
      - name: category
        label: Category
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: medium
        label: Medium
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Uploaded Cover Image
        type: image
      - name: remote_cover
        label: External Cover Image URL
        type: string
        description: "Used for current Google Drive artwork. Uploaded cover takes priority."
      - name: gallery
        label: Artwork Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {group}"
        fields:
          - name: title
            label: Artwork Title
            type: string
          - name: group
            label: Gallery Group
            type: string
          - name: anchor
            label: Direct Link Anchor (optional)
            type: string
          - name: image
            label: Uploaded Image
            type: image
          - name: remote_image
            label: External Image URL
            type: string
          - name: drive_url
            label: Original / External Link
            type: string
          - name: note
            label: Artist Note
            type: text
      - name: featured
        label: Featured on Home
        type: boolean
      - name: external_url
        label: External Link
        type: string
      - name: body
        label: Series Statement / Artist Note
        type: rich-text

  - name: projects
    label: Projects
    type: collection
    path: _projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
      - name: medium
        label: Format / Medium
        type: string
      - name: client
        label: Institution / Collaborator
        type: string
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover Image
        type: image
      - name: remote_cover
        label: External Cover Image URL
        type: string
        description: "Use for externally hosted project images. Uploaded cover takes priority."
      - name: featured
        label: Featured on Home
        type: boolean
      - name: case_study
        label: Long-form Case Study
        type: boolean
      - name: external_url
        label: External Link
        type: string
      - name: body
        label: Project Description
        type: rich-text

  - name: writing
    label: Writing
    type: collection
    path: _writing
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: date
        label: Date
        type: date
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover Image
        type: image
      - name: featured
        label: Featured
        type: boolean
      - name: body
        label: Body
        type: rich-text
