<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#587683">
  <meta name="description" content="OFFITA — Humming in the rain. Listen on your preferred music platform.">
  <meta property="og:title" content="Humming in the rain — OFFITA">
  <meta property="og:description" content="A quiet song about the relief after hearing ‘I love you too.’">
  <meta property="og:type" content="music.song">
  <meta property="og:url" content="https://offitaamor.github.io/humming-in-the-rain/">
  <title>Humming in the rain — OFFITA</title>
  <link rel="icon" href="{{ '/assets/images/brand/offita-emblem.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --rain:#587683;
      --rain-deep:#425f69;
      --paper:#eee3cf;
      --paper-soft:#e6dcc8;
      --ink:#1f2a29;
      --line:rgba(238,227,207,.42);
      --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
      --sans:"Noto Sans KR",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{background:var(--rain);scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 20% 0%,rgba(255,255,255,.06),transparent 34rem),
        var(--rain);
      color:var(--paper);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    .page{
      width:min(100%,620px);
      margin:0 auto;
      padding:28px 22px calc(38px + env(safe-area-inset-bottom));
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:42px;
      margin-bottom:22px;
    }
    .brand{
      width:116px;
      filter:brightness(0) invert(1);
      opacity:.9;
    }
    .edition{
      font-size:9px;
      letter-spacing:.18em;
      text-transform:uppercase;
      opacity:.72;
      white-space:nowrap;
    }
    .cover{
      position:relative;
      width:min(72vw,280px);
      aspect-ratio:1;
      margin:0 auto;
      overflow:hidden;
      border:1px solid rgba(238,227,207,.42);
      background:var(--rain-deep);
      box-shadow:0 18px 46px rgba(18,36,42,.18);
    }
    .cover.has-image{
      background-image:url("{{ '/assets/images/music/humming-in-the-rain.jpg' | relative_url }}");
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
    }
    .cover-fallback{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:12%;
      text-align:center;
      background:
        radial-gradient(circle at 32% 27%,transparent 0 7%,rgba(238,227,207,.13) 7.3% 7.8%,transparent 8.1%),
        radial-gradient(circle at 68% 69%,transparent 0 9%,rgba(238,227,207,.12) 9.3% 9.8%,transparent 10.1%),
        linear-gradient(155deg,#5d7c86,#4b6974);
    }
    .cover.has-image .cover-fallback{display:none}
    .fallback-title{
      font-family:var(--serif);
      font-size:clamp(42px,12vw,72px);
      line-height:.82;
      letter-spacing:-.045em;
      font-weight:500;
    }
    .intro{
      padding:20px 2px 14px;
      text-align:center;
    }
    h1{
      margin:0;
      font-family:var(--serif);
      font-size:clamp(40px,10.5vw,64px);
      line-height:.9;
      letter-spacing:-.045em;
      font-weight:500;
    }
    .artist{
      margin:12px 0 0;
      font-size:11px;
      letter-spacing:.2em;
      font-weight:500;
    }
    .release{
      margin:10px 0 0;
      font-family:var(--serif);
      font-size:18px;
      line-height:1.25;
      color:var(--paper-soft);
    }
    .note{
      margin:18px auto 0;
      max-width:480px;
      font-size:12px;
      line-height:1.7;
      text-align:center;
      color:rgba(238,227,207,.78);
    }
    .listen{
      padding:10px 0 4px;
    }
    .cta-copy{
      margin:0 0 12px;
      text-align:center;
      font-size:12px;
      line-height:1.6;
      font-weight:500;
      color:var(--paper);
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      margin-bottom:14px;
    }
    .section-head h2{
      margin:0;
      font-family:var(--serif);
      font-size:29px;
      line-height:1;
      font-weight:500;
      letter-spacing:-.02em;
    }
    .section-head span{
      font-size:9px;
      letter-spacing:.15em;
      text-transform:uppercase;
      opacity:.62;
    }
    .platforms{
      display:grid;
      gap:8px;
    }
    .platform{
      min-height:52px;
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      font-size:11px;
      letter-spacing:.08em;
      transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
    }
    .platform.active:hover{
      background:var(--paper);
      color:var(--ink);
      border-color:var(--paper);
      transform:translateY(-1px);
    }
    .platform.primary-choice{
      background:var(--paper);
      color:var(--ink);
      border-color:var(--paper);
      font-weight:600;
    }
    .platform.primary-choice:hover{
      background:var(--paper-soft);
      border-color:var(--paper-soft);
    }
    .more-toggle{
      width:100%;
      margin-top:9px;
      min-height:44px;
      border:0;
      border-bottom:1px solid var(--line);
      background:transparent;
      color:rgba(238,227,207,.78);
      font-family:var(--sans);
      font-size:10px;
      letter-spacing:.08em;
      cursor:pointer;
    }
    .secondary-platforms{
      margin-top:9px;
    }
    .secondary-platforms[hidden]{
      display:none;
    }
    .platform.disabled{
      opacity:.35;
      cursor:default;
      pointer-events:none;
    }
    .arrow{font-family:var(--serif);font-size:20px}
    .status{
      margin:15px 0 0;
      font-size:10px;
      line-height:1.65;
      color:rgba(238,227,207,.64);
    }
    footer{
      margin-top:36px;
      padding-top:22px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
    }
    footer a{
      font-size:10px;
      letter-spacing:.14em;
      text-transform:uppercase;
      border-bottom:1px solid transparent;
      padding-bottom:3px;
    }
    footer a:hover{border-color:currentColor}
    .footer-mark{
      width:38px;
      opacity:.78;
      filter:brightness(0) invert(1);
    }
    @media (min-width:760px){
      .page{padding-top:44px;padding-bottom:54px}
      .top{margin-bottom:28px}
      .cover{width:100%;margin:0}
      .intro{padding-top:30px}
    }
  </style>

  <!-- OFFITA analytics: add the GA4 Measurement ID (G-XXXXXXXXXX) below to activate. -->
  <script>
    const OFFITA_GA4_ID = "G-JE8G23VQKE";

    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

    if (/^G-[A-Z0-9]+$/i.test(OFFITA_GA4_ID)) {
      const gaScript = document.createElement("script");
      gaScript.async = true;
      gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(OFFITA_GA4_ID);
      document.head.appendChild(gaScript);

      gtag("js", new Date());
      gtag("config", OFFITA_GA4_ID, {
        send_page_view: true
      });
    }
  </script>

</head>
<body>
  <main class="page">
    <header class="top">
      <a href="{{ '/' | relative_url }}" aria-label="OFFITA home">
        <img class="brand" src="{{ '/assets/images/brand/offita-lockup.svg' | relative_url }}" alt="OFFITA">
      </a>
      <span class="edition">RAIN EDITION · 2026</span>
    </header>

    <div class="cover" id="cover">
      <div class="cover-fallback" aria-hidden="true">
        <div class="fallback-title">Humming<br>in the rain</div>
      </div>
    </div>

    <section class="intro">
      <h1>Humming in the rain</h1>
      <p class="artist">OFFITA</p>
      <p class="release">25 SEP 2026</p>
    </section>

    <section class="listen" aria-labelledby="listen-title">
      <p class="cta-copy">원하는 플랫폼에서 바로 듣기</p>
      <div class="platforms" id="primary-platforms"></div>
      <button class="more-toggle" id="more-toggle" type="button" aria-expanded="false" aria-controls="secondary-platforms">다른 플랫폼 보기 +</button>
      <div class="platforms secondary-platforms" id="secondary-platforms" hidden></div>
      <p class="status" id="status">Now available.</p>
    </section>

    <p class="note">A quiet song about the relief that arrives after hearing “I love you too.”</p>

    <footer>
      <a href="{{ '/' | relative_url }}">OFFITA — WEBSITE</a>
      <img class="footer-mark" src="{{ '/assets/images/brand/offita-emblem.svg' | relative_url }}" alt="">
    </footer>
  </main>

  <script>
    /*
      RELEASE-DAY EDIT:
      Paste each direct song URL between the quotes below.
      Blank URLs stay visually disabled and cannot be clicked.
    */
    const STREAMING_LINKS = [
      ["Spotify", "https://open.spotify.com/album/21MeaNA8qqIlaQTnncpWar"],
      ["Apple Music", "https://music.apple.com/kr/album/humming-in-the-rain-single/6814389521"],
      ["YouTube Music", "https://music.youtube.com/watch?v=6uQ9GCPJNag"],
      ["Melon", "https://www.melon.com/album/detail.htm?albumId=14576245"],
      ["Genie", "https://www.genie.co.kr/detail/albumInfo?axnm=88191676"],
      ["Bugs", "https://music.bugs.co.kr/album/20842913"],
      ["FLO", "https://www.music-flo.com/detail/track/608912748/details"],
      ["VIBE", "https://vibe.naver.com/track/108036873"]
    ];


    const campaignParams = (() => {
      const params = new URLSearchParams(window.location.search);
      return {
        utm_source: params.get("utm_source") || "(direct)",
        utm_medium: params.get("utm_medium") || "(none)",
        utm_campaign: params.get("utm_campaign") || "(not set)",
        utm_content: params.get("utm_content") || "(not set)"
      };
    })();

    function trackStreamingClick(platform, destination) {
      if (typeof gtag !== "function" || !/^G-[A-Z0-9]+$/i.test(OFFITA_GA4_ID)) return;
      const linkDomain = (() => {
        try { return new URL(destination).hostname; } catch (_) { return ""; }
      })();
      const eventParams = {
        platform_name: platform,
        outbound_url: destination,
        link_domain: linkDomain,
        transport_type: "beacon",
        ...campaignParams
      };
      gtag("event", "streaming_click", eventParams);

      const platformEvent = "platform_click_" + platform
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
      gtag("event", platformEvent, {
        link_domain: linkDomain,
        transport_type: "beacon",
        ...campaignParams
      });
    }

    const primaryWrap = document.getElementById("primary-platforms");
    const secondaryWrap = document.getElementById("secondary-platforms");
    const moreToggle = document.getElementById("more-toggle");
    const PRIMARY_ORDER = ["Melon", "YouTube Music", "Spotify"];
    const activeCount = STREAMING_LINKS.filter(([, url]) => url.trim()).length;

    function makePlatformLink(name, url, isPrimary) {
      const link = document.createElement("a");
      link.className = "platform " + (url.trim() ? "active" : "disabled") + (isPrimary ? " primary-choice" : "");
      link.href = url.trim() || "#";
      if (url.trim()) {
        link.target = "_blank";
        link.rel = "noopener";
        link.setAttribute("aria-label", name + "에서 Humming in the rain 듣기");
        link.addEventListener("click", () => trackStreamingClick(name, url));
      } else {
        link.setAttribute("aria-disabled", "true");
        link.tabIndex = -1;
      }
      link.innerHTML = "<span>" + name + "</span><span class=\"arrow\">↗</span>";
      return link;
    }

    PRIMARY_ORDER.forEach((name) => {
      const item = STREAMING_LINKS.find(([platform]) => platform === name);
      if (item) primaryWrap.appendChild(makePlatformLink(item[0], item[1], true));
    });

    STREAMING_LINKS
      .filter(([name]) => !PRIMARY_ORDER.includes(name))
      .forEach(([name, url]) => secondaryWrap.appendChild(makePlatformLink(name, url, false)));

    moreToggle.addEventListener("click", () => {
      const expanded = moreToggle.getAttribute("aria-expanded") === "true";
      moreToggle.setAttribute("aria-expanded", String(!expanded));
      secondaryWrap.hidden = expanded;
      moreToggle.textContent = expanded ? "다른 플랫폼 보기 +" : "다른 플랫폼 접기 −";
      if (!expanded && typeof gtag === "function") {
        gtag("event", "platform_list_expand", { transport_type: "beacon" });
      }
    });

    if (activeCount > 0) {
      document.getElementById("status").textContent = "Now available.";
    }

    const cover = document.getElementById("cover");
    const coverImage = new Image();
    coverImage.onload = () => cover.classList.add("has-image");
    coverImage.src = "{{ '/assets/images/music/humming-in-the-rain.jpg' | relative_url }}";
  </script>
</body>
</html>
