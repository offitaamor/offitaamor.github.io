heading: "Across sound, image, place and narrative."
bio_short: "OFFITA는 음악, 시각 이미지, 장소와 사람의 서사를 하나의 작업 세계 안에서 연결하는 아티스트입니다."
bio_long: |
  음악가·시각작가·예술 프로젝트 참여자로서 서로 다른 매체 사이의 공통 감각을 탐색합니다.
  완성된 결과물뿐 아니라 작업이 만들어지는 과정, 사람과 장소의 관계, 그 과정에서 생기는 질문도 작업의 일부로 다룹니다.
statement: |
  이 영역은 Pages CMS에서 직접 수정할 수 있습니다.
  이후 작가 소개, 작업 철학, CV와 보도자료를 단계적으로 보완하면 됩니다.
