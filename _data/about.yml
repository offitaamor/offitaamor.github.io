heading: "Across sound, image, place and narrative."
bio_short: "OFFITA는 음악, 시각 이미지, 장소와 사람의 서사를 하나의 작업 세계 안에서 연결하는 아티스트입니다."
bio_long: |
  음악가·시각작가·예술 프로젝트 참여자로서 서로 다른 매체 사이의 공통 감각을 탐색합니다.
  완성된 결과물뿐 아니라 작업이 만들어지는 과정, 사람과 장소의 관계, 그 과정에서 생기는 질문도 작업의 일부로 다룹니다.
statement: |
  제 작업은 이미 존재하는 사람과 장소, 사물과 기억을 다시 바라보는 데서 출발합니다. 익숙하다는 이유로 지나치거나 충분히 알려지지 않은 대상의 고유성을 관찰하고, 그 안의 가치가 새롭게 보이도록 표현합니다.

  음악에서는 장르의 역사와 문법을 표현 재료로 사용합니다. 전달하려는 대상의 성질에 맞게 멜로디와 악기, 구조와 음향을 선택하고, 필요할 때는 서로 다른 장르의 원리를 다시 조합합니다. 시각 작업에서는 사람의 삶과 장소의 이야기, 기억과 상징을 조사한 뒤 새로운 이미지로 구성합니다.

  지역 프로젝트와 협업에서는 결과물뿐 아니라 사람 사이의 관계와 창작 과정에도 관심을 둡니다. 누군가의 이야기를 대신 규정하기보다 그 사람이 가진 특징을 이해하고, 관객이 스스로 발견할 수 있는 장면을 만드는 것이 중요합니다.

  음악과 이미지, 장소와 서사가 서로 다른 매체로 보이더라도, 제게는 하나의 질문으로 이어집니다. 어떻게 하면 이미 존재하는 아름다움과 가치를 새롭게 발견하고 다른 사람에게 전할 수 있을까.
