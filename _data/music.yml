hero_statement: "장르를 분류가 아닌 표현의 언어로 바라봅니다."
intro: >-
  장르의 역사와 문화적 배경, 음악적 문법을 연구하고 이를 작품의 표현 재료로 활용합니다.
  표현하려는 대상에 따라 장르와 악기, 구조와 음향을 선택하거나 재구성하며,
  새로운 사운드와 음악 구조를 실험합니다.

practice: |-
  장르가 만들어진 시대와 문화, 그 배경이 리듬과 악기, 음색에 남긴 흔적을 살펴봅니다. 곡의 주제에 맞게 장르의 문법을 선택하고 필요하면 다른 원리와 다시 조합합니다.

  개인적인 곡은 일상에서 떠오른 멜로디와 가사로 시작하기도 합니다. 톱라인과 보컬을 중심에 두고 어쿠스틱한 질감, 넓은 공간감과 긴 잔향을 사용합니다. 작품마다 필요한 소리와 구조를 새로 찾는 과정 자체가 OFFITA의 작업 방식입니다.

characteristics:
  - code: "01"
    title: "장르를 표현의 재료로 사용한다"
    en: "Genre as Material"
    description: >-
      장르를 단순한 음악 분류로 보기보다, 특정한 시대와 문화, 집단의 경험이 축적된 하나의 음악적 언어로 바라봅니다.
      각 장르의 형성 과정과 특징을 탐구하고, 작품이 다루는 대상에 따라 필요한 요소를 선택하거나 변형합니다.
  - code: "02"
    title: "주제와 직관, 두 방향에서 시작한다"
    en: "Concept & Intuition"
    description: >-
      하나는 주제를 먼저 정한 뒤 대상의 고유한 성질을 분석하고 이를 장르와 악기, 구조와 음향으로 옮기는 방식입니다.
      다른 하나는 일상에서 자연스럽게 떠오른 멜로디와 가사에서 출발해 이후 곡의 개념과 편곡을 만들어가는 방식입니다.
  - code: "03"
    title: "멜로디와 톱라인을 중심에 둔다"
    en: "Topline & Melody"
    description: >-
      멜로디와 가사, 보컬의 리듬이 함께 만들어지는 순간을 중요하게 생각합니다.
      직관적으로 떠오른 톱라인을 곡의 중심에 두고, 선율이 가진 감정과 언어의 흐름을 바탕으로 작품의 방향을 구체화합니다.
  - code: "04"
    title: "몽롱하고 넓은 공간감을 만든다"
    en: "Atmospheric Sound"
    description: >-
      개인적인 음악에서는 어쿠스틱한 악기의 질감과 긴 리버브, 넓게 퍼지는 공간감, 차분한 보컬 사운드를 선호합니다.
      인디팝과 아트팝, 드림팝을 중심으로 사이키델릭하고 멜랑콜릭한 분위기가 자연스럽게 섞입니다.
  - code: "05"
    title: "보컬을 하나의 악기로 다룬다"
    en: "Vocal as Instrument"
    description: >-
      보컬을 하나의 고정된 음색으로 사용하기보다 곡의 성격에 따라 달라질 수 있는 또 하나의 악기로 바라봅니다.
      저음과 고음에서 나타나는 서로 다른 음색과 미성, 몽롱한 창법을 활용하며 노래와 랩의 경계를 넘나드는 방식도 시도합니다.
  - code: "06"
    title: "새로운 소리와 구조를 실험한다"
    en: "Experimentation"
    description: >-
      새로운 악기 사운드와 음악 구조, 화성적 긴장과 불협화음의 활용을 실험합니다.
      기존 장르를 단순히 섞기보다 각각의 요소가 작동하는 원리를 이해하고 새로운 규칙으로 다시 구성하는 데 관심을 둡니다.

practice_intro: >-
  작사와 작곡, 편곡, 보컬, 음향, 앨범아트를 서로 분리된 영역으로 생각하지 않습니다.
  모두 하나의 대상과 생각을 표현하기 위해 사용하는 서로 다른 수단으로 바라보며,
  곡의 초기 아이디어와 콘셉트부터 최종 사운드와 이미지까지 하나의 방향 안에서 연결합니다.

