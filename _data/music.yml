  - "Songwriting"
  - "Composition"
  - "Lyrics"
  - "Vocal"
  - "Arrangement"
  - "Production"
  - "Mixing"
  - "Mastering"
  - "Art Direction"

aesthetic: |-
  개인적으로는 인디팝과 아트팝, 드림팝 계열의 음악에 가장 자연스럽게 끌립니다. 힘을 과하게 주지 않은 몽롱하고 차분한 보컬, 어쿠스틱한 악기의 질감, 길고 깊게 남는 리버브와 넓은 공간감을 좋아합니다.

  여기에 사이키델릭 록과 멜랑콜릭한 정서가 섞이는 음악 역시 선호합니다. 일상에서 자연스럽게 만들어지는 개인적인 곡들은 이러한 취향이 비교적 직접적으로 드러나는 편입니다.

