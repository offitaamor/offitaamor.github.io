food:
  - {image: jjimgalbi, title: '대구 찜갈비', caption: '동인동식 찜갈비의 붉은 양념과 양푼을 인물로 옮겼다.'}
  - {image: mungtigi, title: '대구 뭉티기 — 붉은 마담', caption: '뭉티기의 질감과 붉은 색을 한 인물의 태도로 표현했다.'}
  - {image: ttaro-gukbap, title: '대구 따로국밥', caption: '국과 밥이 따로 놓이는 한 상을 무신과 호위 인물로 그렸다.'}
  - {image: napjak-mandu, title: '대구 납작만두', caption: '얇은 피와 소박한 골목 간식의 분위기를 담았다.'}
  - {image: fried-gizzard, title: '대구 닭똥집튀김', caption: '튀김의 색, 은박 테이블, 세 가지 양념을 인물 주변에 놓았다.'}
  - {image: makchang, title: '대구 막창', caption: '연탄구이와 곱창 머리끈을 젊은 인물의 소품으로 바꾸었다.'}
  - {image: yakki-udon, title: '대구 야끼우동', caption: '매운 양념과 면발의 움직임을 교복 차림의 인물로 풀었다.'}
people:
