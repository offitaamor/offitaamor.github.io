hero_statement: "사람들이 보지 못했던 대상의 아름다움과 가치를 포착해, 새로운 관점으로 소개하는 중개인 같은 예술가."
intro: "OFFITA의 시각 작업은 이미 존재하는 사람과 장소, 사물과 기억을 새롭게 바라보는 것에서 시작합니다. 익숙해서 지나쳤거나 아직 충분히 알려지지 않았거나, 그 가치가 쉽게 드러나지 않는 대상을 관찰하고 그 안의 고유성을 발견합니다."
practice: |
  OFFITA는 자신의 스타일을 대상 위에 먼저 씌우기보다, 대상을 충분히 이해한 뒤 그 대상에 맞는 표현을 찾는 것을 중요하게 생각합니다.

  사람을 그릴 때는 얼굴의 형태만 보지 않습니다. 그 사람이 어떤 삶을 살아왔는지, 무엇을 하고 있는지, 누구와 어떤 관계를 맺고 있는지, 작가가 그 사람을 어떻게 경험했는지를 함께 봅니다.

  장소를 다룰 때도 외형적인 풍경만을 기록하지 않습니다. 그곳에서 누가 살았는지, 무엇을 먹었는지, 어떤 일이 있었는지, 무엇이 사라졌고 어떤 기억이 남아 있는지를 살펴봅니다. 음악이나 감정처럼 눈으로 직접 볼 수 없는 대상을 다룰 때에는 그것을 가장 잘 설명할 수 있는 장면과 사물, 색과 상징을 찾습니다.

  이렇게 조사하고 관계 맺으며 발견한 고유성을 선택하고 덜어내고 강조해 하나의 새로운 이미지로 재구성합니다. OFFITA에게 그림은 이미 존재하고 있지만 아직 충분히 보이지 않았던 아름다움과 가치를 발견하고, 사람들이 다시 바라볼 수 있는 방식으로 소개하는 일에 가깝습니다.
method:
  - code: "01"
    en: "DISCOVER"
    ko: "발견하다"
    description: "쉽게 지나쳤거나 아직 충분히 주목받지 못한 사람, 장소, 기억, 사물과 가치를 발견합니다."
  - code: "02"
    en: "UNDERSTAND"
    ko: "이해하다"
    description: "관찰하고 조사하고 관계를 맺으며 대상의 배경과 맥락, 그리고 그 대상을 특별하게 만드는 고유성을 이해합니다."
  - code: "03"
    en: "REFRAME"
    ko: "새롭게 바라보다"
    description: "발견한 특징을 선택하고 강조하고 재배치하여 익숙했던 대상을 이전과 다른 관점에서 볼 수 있도록 다시 구성합니다."
  - code: "04"
    en: "PRESENT"
    ko: "다시 소개하다"
    description: "그 결과를 하나의 이미지와 시각적 세계로 만들어 관객이 그 대상을 새로운 시선으로 바라보도록 합니다."
language_intro: "OFFITA의 대표적인 시각 언어는 Hand-Traced Analog Narrative Style입니다. 얇고 완벽하게 정제되지 않은 검은 선, 제한된 평면 색채, 종이와 인쇄물을 연상시키는 질감, 서사적 이유를 가진 상징과 타이포그래피를 사용합니다. 형식 자체보다 중요한 것은 작가가 무엇을 발견했고, 무엇을 남기고 무엇을 덜어냈는지가 이미지 안에서 드러나는 것입니다."
language:
  - "HAND-TRACED"
  - "ANALOG SURFACE"
  - "LIMITED COLOR"
  - "NARRATIVE SYMBOL"
  - "TYPOGRAPHY"
  - "CONTROLLED IMPERFECTION"
