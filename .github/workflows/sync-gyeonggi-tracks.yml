name: Sync Gyeonggi Tracks Artwork
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_gyeonggi_tracks.py"
      - ".github/workflows/sync-gyeonggi-tracks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Fetch and optimize OFFITA artwork
        run: python scripts/sync_gyeonggi_tracks.py
      - name: Commit Gyeonggi assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gyeonggi-tracks/assets/
          if git diff --cached --quiet; then
            echo "Images unchanged."
            exit 0
          fi
          git commit -m "Add optimized Gyeonggi Tracks artwork and map"
          git push
