name: Sync Visual Images

on:
  push:
    branches: [main]
    paths:
      - "_data/visual-drive.tsv"
      - "scripts/sync_visual_images.py"
      - ".github/workflows/sync-visual-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download and optimize Drive images
        run: python scripts/sync_visual_images.py

      - name: Commit synced images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/uploads/visual
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Sync Visual images from Google Drive"
          git push
