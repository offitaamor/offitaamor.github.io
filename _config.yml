title: "OFFITA"
description: "OFFITA — music, visual art, projects and writing."
url: "https://offitaamor.github.io"
baseurl: ""
lang: "ko"
timezone: "Asia/Seoul"
markdown: kramdown
plugins:
  - jekyll-sitemap

collections:
  music:
    output: true
    permalink: /music/:name/
  visual:
    output: true
    permalink: /visual/:name/
  myeongpa_works:
    output: true
    permalink: /visual/myeongpa/:name/
  projects:
    output: true
    permalink: /projects/:name/
  writing:
    output: true
    permalink: /writing/:name/

defaults:
  - scope:
      path: ""
      type: music
    values:
      layout: detail
      section: MUSIC
  - scope:
      path: ""
      type: visual
    values:
      layout: detail
      section: VISUAL
  - scope:
      path: ""
      type: myeongpa_works
    values:
      layout: myeongpa-work
      stylesheet: "/assets/css/myeongpa.css"
      myeongpa_analytics: true
  - scope:
      path: ""
      type: projects
    values:
      layout: detail
      section: PROJECTS
  - scope:
      path: ""
      type: writing
    values:
      layout: article
      section: WRITING

exclude:
  - README.md
  - UPLOAD-GUIDE.md
